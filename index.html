<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToneForge — AI Song Finder, Streamer & Tone Matcher</title>
<style>
:root{
  --bg:#0b0d12;
  --panel:#141821;
  --panel2:#191f2b;
  --line:#2a3241;
  --text:#f3f5f8;
  --muted:#a5afbf;
  --red:#ff5148;
  --red-hover:#e04139;
  --gold:#ffc86a;
  --green:#8ce0b0;
  --blue:#6cb8f6;
  --purple:#c678dd;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top right,#25202a 0,#0b0d12 48%);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  min-height:100vh;
}
.wrap{max-width:1220px;margin:auto;padding:24px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-weight:900;letter-spacing:.08em;font-size:22px}
.brand span{color:var(--red)}
.badge{border:1px solid #45404a;color:#ffd7d3;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:700}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.06;margin:0 0 10px;letter-spacing:-.04em}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--muted);max-width:760px;line-height:1.6;margin:0 0 20px;font-size:14px}

.gear{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 24px}
.gear-card,.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px}
.gear-card small,.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:800}
.gear-card strong{display:block;font-size:16px;margin-top:6px;color:#fff}
.gear-card p{color:var(--muted);font-size:12px;margin:4px 0 0;line-height:1.5}
.gear-select{
  width:100%;background:#0d1118;border:1px solid #343d4d;color:var(--gold);padding:8px;border-radius:8px;font:inherit;font-size:12px;font-weight:700;margin-top:8px;outline:none;
}

.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;align-items:start}
.card h2{font-size:19px;margin:6px 0 14px}
.field{margin:13px 0}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{
  width:100%;background:#0d1118;border:1px solid #343d4d;color:var(--text);padding:11px;border-radius:9px;font:inherit;outline:none;transition:border-color .2s;
}
.field input:focus,.field select:focus{border-color:var(--red)}

.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.part{background:#0e1219;border:1px solid #303848;color:var(--muted);border-radius:9px;padding:9px 6px;cursor:pointer;font-weight:700;font-size:11px;text-align:center;transition:all .15s}
.part:hover{border-color:var(--muted);color:#fff}
.part.active{border-color:var(--red);background:#351b20;color:#fff}

/* AI PLAYER DECK */
.ai-player-deck{
  background:#090d15;
  border:2px solid #28374f;
  border-radius:14px;
  padding:14px;
  margin:14px 0;
  transition:all .2s;
}
.ai-player-deck.playing{
  border-color:var(--red);
  box-shadow:0 0 20px rgba(255,81,72,0.3);
}
.deck-top{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:10px;
}
.track-art{
  width:52px;
  height:52px;
  border-radius:8px;
  background:#131a26;
  object-fit:cover;
  border:1px solid #273448;
}
.track-meta{flex:1;overflow:hidden}
.track-meta b{display:block;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-meta span{font-size:11px;color:var(--muted);display:block}

#scopeCanvas{
  width:100%;
  height:80px;
  background:#040609;
  border-radius:8px;
  border:1px solid #1a2433;
  margin-bottom:10px;
  display:block;
}

.btn-ai-play{
  background:linear-gradient(135deg, #ff5148, #c43831);
  color:#fff;
  border:none;
  padding:13px 18px;
  border-radius:10px;
  font-weight:900;
  font-size:13px;
  cursor:pointer;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all .2s;
}
.btn-ai-play:hover{filter:brightness(1.1)}
.btn-ai-play:disabled{opacity:0.5;cursor:not-allowed}

.ai-status-pill{
  font-size:11px;
  color:var(--gold);
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
  line-height:1.4;
}

.badge-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:10px;border:1px solid #384253;border-radius:999px;padding:4px 8px;font-weight:700;letter-spacing:.04em}
.pill.green{color:var(--green);border-color:#204834}
.pill.gold{color:var(--gold);border-color:#53432a}
.pill.blue{color:var(--blue);border-color:#2a3e53}

.preset-hero{
  background:linear-gradient(135deg, #1b212f, #10141d);
  border:1px solid #323d52;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}
.preset-tag{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--red);text-transform:uppercase}
.preset-title{font-size:22px;font-weight:900;margin:4px 0 2px;color:#fff}
.preset-subtitle{font-size:12px;color:var(--muted)}

/* WHAT THE AI HEARD */
.heard-card{
  background:#0d131f;
  border:2px solid #2c4161;
  border-radius:12px;
  padding:14px;
  margin:12px 0;
}
.heard-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-size:11px;
  font-weight:800;
  color:var(--green);
  text-transform:uppercase;
  letter-spacing:.08em;
}
.heard-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:6px;
  margin-bottom:10px;
  text-align:center;
}
.heard-metric{
  background:#131c2b;
  border:1px solid #202d42;
  border-radius:8px;
  padding:8px 4px;
}
.heard-metric .h-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800}
.heard-metric .h-val{font-size:13px;font-weight:900;color:var(--gold);margin-top:2px}

.amp-matrix{
  background:#0c0f16;
  border:1px solid #283244;
  border-radius:12px;
  padding:14px;
  margin:12px 0;
}
.amp-name-plate{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:1px solid #1f2736;
  padding-bottom:8px;
  margin-bottom:12px;
}
.amp-name-plate strong{font-size:16px;color:var(--gold);letter-spacing:.05em}
.amp-name-plate span{font-size:11px;color:var(--muted)}

.knobs-grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:8px;
  text-align:center;
}
.knob-pod{
  background:#131824;
  border:1px solid #252f42;
  border-radius:10px;
  padding:8px 4px;
}
.knob-pod .k-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.05em}
.knob-pod .k-val{font-size:18px;font-weight:900;color:var(--gold);margin:4px 0 2px}
.knob-pod .k-sub{font-size:9px;color:#6b778c}

.chain-container{margin:14px 0}
.chain-step{
  background:#0d1118;
  border:1px solid #242e40;
  border-radius:10px;
  padding:11px 13px;
  margin-bottom:8px;
  display:grid;
  grid-template-columns:110px 1fr;
  gap:10px;
  align-items:start;
}
.chain-step.empty{opacity:0.6}
.chain-badge{
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  padding:4px 8px;
  border-radius:6px;
  text-align:center;
  display:inline-block;
}
.chain-badge.stomp{background:#351a14;color:#ff9171;border:1px solid #5a2c22}
.chain-badge.mod{background:#112437;color:#78c2ff;border:1px solid #1f4265}
.chain-badge.delay{background:#102c1f;color:#7fe4a8;border:1px solid #1c5237}
.chain-badge.rev{background:#2a1934;color:#df9cf7;border:1px solid #512b66}
.chain-badge.bypassed{background:#151921;color:#69758a;border:1px solid #283141}

.step-details b{color:#fff;font-size:13px}
.step-details .p-list{margin:4px 0;display:flex;flex-wrap:wrap;gap:6px;font-size:11px}
.step-details .p-chip{background:#171d2b;border:1px solid #2e394e;padding:2px 7px;border-radius:5px;color:var(--gold)}
.step-details .step-desc{font-size:11px;color:var(--muted);line-height:1.4}

.guitar-card{
  background:#0e131d;
  border:1px solid #273347;
  border-radius:12px;
  padding:14px;
  margin:14px 0;
}
.guitar-card .p-title{
  font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px
}
.pickup-viz{display:flex;gap:6px;margin:8px 0}
.pu-bobbin{flex:1;text-align:center;padding:7px 2px;border:1px solid #343e50;border-radius:6px;font-size:10px;color:var(--muted);background:#131822}
.pu-bobbin.active{border-color:var(--red);background:#381a1f;color:#fff;font-weight:800}

.setup-guide{
  background:#10151f;
  border:1px solid #2c3649;
  border-radius:12px;
  padding:14px;
  margin:14px 0;
}
.setup-guide h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.setup-guide ol{margin:0;padding-left:18px;font-size:12px;color:var(--text);line-height:1.6}
.setup-guide li{margin-bottom:6px}

.error-msg{
  background:#381014;border:2px solid #ff4d5a;color:#ffcad0;padding:12px;border-radius:10px;font-size:12px;font-weight:600;margin:12px 0;display:none;line-height:1.5;
}
.error-msg.show{display:block}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.footer{color:#7f8999;font-size:11px;line-height:1.6;margin-top:24px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.knobs-grid{grid-template-columns:repeat(3,1fr)}.heard-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
